// Known federated ID mappings (bootstrapped, user can add more; user-added persist in localStorage)

function loadFedIds(){
  var raw=null;try{raw=localStorage.getItem("gf")}catch(e){}
  if(raw!=null){try{return JSON.parse(raw)}catch(e){return Object.assign({},BOOT_FED_IDS)}}
  return Object.assign({},BOOT_FED_IDS); // primer arranque: sin nada guardado aun, usar el bootstrap
}

// Optional session persistence (sessionStorage: survives reload, dies with the tab)
// btoa exige latin1; encodeURIComponent/unescape lo hace seguro para usuarios con ñ, tildes, etc.
function b64encU(s){return btoa(unescape(encodeURIComponent(s)))}
function b64decU(s){return decodeURIComponent(escape(atob(s)))}
try{if(!window._rfegCreds&&sessionStorage.getItem("rc")){window._rfegCreds=JSON.parse(b64decU(sessionStorage.getItem("rc")))}}catch(e){}
function persistCreds(c){try{if(c)sessionStorage.setItem("rc",b64encU(JSON.stringify(c)));else sessionStorage.removeItem("rc")}catch(e){}}

// Share/export: render the HI chart SVG to a PNG card and share or download it.
// onError recibe un mensaje legible para mostrar feedback al usuario si algo falla.
async function shareChartPNG(containerId,name,hi,onError){
  try{
    var svg=document.querySelector("#"+containerId+" svg");if(!svg)throw new Error("No se encontro la grafica");
    // iOS/Safari no rasteriza SVGs sin width/height intrinsecos: clonamos y se los fijamos desde el viewBox
    var vb=svg.viewBox.baseVal;
    var clone=svg.cloneNode(true);
    clone.setAttribute("width",vb.width);
    clone.setAttribute("height",vb.height);
    var xml=new XMLSerializer().serializeToString(clone);
    // La tarjeta exportada siempre usa los colores fijos del tema Torneo (ver mas abajo);
    // si el usuario tenia el modo Papel activo, el SVG clonado trae sus colores claros
    // "horneados" en los atributos -- los remapeamos aqui a sus equivalentes oscuros para
    // que la linea/puntos no desaparezcan sobre el fondo verde fijo de la imagen.
    if(THEMES.paper.contour!==THEMES.dark.contour){
      Object.keys(THEMES.paper).forEach(function(k){
        var from=THEMES.paper[k],to=THEMES.dark[k];
        if(from&&to&&from!==to)xml=xml.split(from).join(to);
      });
    }
    var scale=3,W=Math.round(vb.width*scale),H=Math.round(vb.height*scale),head=96;
    var canvas=document.createElement("canvas");canvas.width=W;canvas.height=H+head;
    var ctx=canvas.getContext("2d");
    // Tarjeta de marca fija (verde Augusta/amarillo Masters): la imagen que se comparte
    // debe verse siempre como HCAPP, independientemente del modo Torneo/Papel activo.
    try{await Promise.all([document.fonts.load("700 34px 'Space Grotesk'"),document.fonts.load("500 22px 'JetBrains Mono'")])}catch(e){}
    ctx.fillStyle="#046A38";ctx.fillRect(0,0,W,H+head);
    ctx.fillStyle="#F5D400";ctx.font="700 34px 'Space Grotesk',sans-serif";ctx.fillText("HCAPP · "+(name||"Evolucion del Handicap"),28,46);
    ctx.fillStyle="#F4F1E9";ctx.font="500 22px 'JetBrains Mono',monospace";ctx.fillText("Handicap Index: "+(hi!=null?hi:"—")+"  ·  "+new Date().toLocaleDateString("es-ES"),28,80);
    var img=new Image();
    await new Promise(function(res,rej){img.onload=res;img.onerror=function(){rej(new Error("No se pudo generar la imagen"))};img.src="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(xml)});
    ctx.drawImage(img,0,head,W,H);
    var blob=await new Promise(function(res){canvas.toBlob(res,"image/png")});
    if(!blob)throw new Error("No se pudo generar la imagen");
    var file=new File([blob],"handicap.png",{type:"image/png"});
    if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file],title:"Evolucion del Handicap"});return}catch(e){if(e&&e.name==="AbortError")return}}
    var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="handicap.png";a.click();setTimeout(function(){URL.revokeObjectURL(a.href)},5000);
  }catch(e){
    if(onError)onError(e.message||"No se pudo generar la imagen");
  }
}

// WHS Engine
function getTakeCount(count) {
  return count >= 20 ? 8 : count >= 19 ? 7 : count >= 17 ? 6 : count >= 15 ? 5 :
    count >= 12 ? 4 : count >= 9 ? 3 : count >= 6 ? 2 : count >= 3 ? 1 : 0;
}

function calcHandicapIndex(rounds) {
  const w = rounds.slice(-20);
  if (!w.length) return null;
  const take = getTakeCount(w.length);
  if (take === 0) return null;
  // En empate, preferir la más reciente (índice mayor en array cronológico)
  const sorted = [...w].map((r, i) => ({ ...r, i }))
    .sort((a, b) => a.differential - b.differential || b.i - a.i);
  const avg = sorted.slice(0, take).reduce((s, r) => s + r.differential, 0) / take;
  return Math.min(Math.round(avg * 10) / 10, 54.0);
}

function getBestIndices(rounds) {
  const take = getTakeCount(rounds.length);
  return new Set(
    [...rounds].map((r, i) => ({ ...r, i }))
      // En empate de diferencial, la RFEG prefiere la ronda más reciente
      // En orden cronológico, índice mayor = más reciente
      .sort((a, b) => a.differential - b.differential || b.i - a.i)
      .slice(0, take).map(r => r.i)
  );
}

function simulateNextRound(rounds, gross, cr, slope, asc, overrideDiff) {
  const newDiff = overrideDiff !== undefined
    ? overrideDiff
    : Math.round(((gross - cr - (asc || 0)) * 113 / slope) * 10) / 10;
  const simRounds = [...rounds.slice(-19), { differential: newDiff }];
  const newHI = calcHandicapIndex(simRounds);
  const window20 = simRounds.slice(-20);
  const take = getTakeCount(window20.length);
  const sorted = [...window20].map((r, i) => ({ diff: r.differential, i })).sort((a, b) => a.diff - b.diff || b.i - a.i);
  const bestSet = new Set(sorted.slice(0, take).map(r => r.i));
  const newComputes = bestSet.has(window20.length - 1);
  return { newHandicap: newHI, differential: newDiff, computes: newComputes };
}
var getTC=getTakeCount,calcHI=calcHandicapIndex,getBest=getBestIndices;
function simRound(rds,g,cr,sl,asc,overrideDiff){var r=simulateNextRound(rds,g,cr,sl,asc,overrideDiff);return{nh:r.newHandicap,df:r.differential,cp:r.computes}}



// PDF Parser
async function loadPdfJs() {
  if (window.pdfjsLib) return window.pdfjsLib;
  return new Promise((resolve, reject) => {
    const s = document.createElement("script");
    s.src = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js";
    s.onload = () => {
      window.pdfjsLib.GlobalWorkerOptions.workerSrc =
        "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
      resolve(window.pdfjsLib);
    };
    s.onerror = reject;
    document.head.appendChild(s);
  });
}

async function parsePDF(file) {
  const pdfjsLib = await loadPdfJs();
  const buf = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
  const pages = [];
  for (let i = 1; i <= pdf.numPages; i++) {
    const pg = await pdf.getPage(i);
    const c = await pg.getTextContent();
    pages.push(c.items.map(item => item.str).join(" "));
  }
  return extractRFEGData(pages.join("\n"), pages);
}

async function fetchParse(lic,onM){
  onM("Cargando motor PDF...");await loadPdfJs();
  var blob=null;var errLog=[];var hiOnly=null;

  async function isPdfBlob(b){
    if(!b||b.size<500)return false;
    try{var ab=await b.slice(0,4).arrayBuffer();var bytes=new Uint8Array(ab);return bytes[0]===0x25&&bytes[1]===0x50&&bytes[2]===0x44&&bytes[3]===0x46}catch(e){return false}
  }

  // Get stored credentials (session only, never persisted)
  var creds=window._rfegCreds||null;
  var fedId=window._rfegFedIds&&window._rfegFedIds[lic];

  // Intento 1: PDF via api.rfeg.es (public, works for any license)
  onM("Conectando con la RFEG...");
  try{
    var r1=await fetch(COURSES_API+"/?pdf="+lic,{mode:"cors"});
    if(r1.ok){var b1=await r1.blob();if(await isPdfBlob(b1)){blob=b1}else{errLog.push("PDF publico: no PDF ("+b1.size+"b)")}}
    else{errLog.push("PDF publico: HTTP "+r1.status)}
  }catch(e1){errLog.push("PDF publico: "+e1.message)}

  // Intento 2: PDF via api.rfegolf.es (authenticated, own+linked only)
  if(!blob&&creds&&fedId){
    onM("Descargando datos autenticados...");
    try{
      var r2=await fetch(COURSES_API+"/?auth_pdf="+fedId,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:creds.u,password:creds.p})});
      if(r2.ok){
        var ct=r2.headers.get("content-type")||"";
        if(ct.includes("pdf")){var b2=await r2.blob();if(await isPdfBlob(b2)){blob=b2}else{errLog.push("Auth PDF: no valido")}}
        else{var j2=await r2.json().catch(function(){return{}});errLog.push("Auth PDF: "+(j2.message||j2.error||"error"))}
      }else{
        var j2b=await r2.json().catch(function(){return{}});
        errLog.push("Auth PDF: "+(j2b.message||"HTTP "+r2.status))
      }
    }catch(e2){errLog.push("Auth PDF: "+e2.message)}
  }

  // If we have a PDF blob, parse it
  if(blob){
    onM("Analizando datos...");
    var buf=await blob.arrayBuffer();
    var pdf;
    try{pdf=await window.pdfjsLib.getDocument({data:buf}).promise}catch(e){throw new Error("PDF corrupto: "+e.message)}
    var pages=[];
    for(var i=1;i<=pdf.numPages;i++){var pg=await pdf.getPage(i);var c=await pg.getTextContent();pages.push(c.items.map(function(x){return x.str}).join(" "))}
    var r=extractRFEGData(pages.join("\n"),pages);
    if(!r.rounds.length)throw new Error("Sin rondas en el PDF");
    return{name:r.player_name,hi:r.handicap_index,rounds:r.rounds,source:"pdf"};
  }

  // Intento 3: HI only via authenticated /federated/{id}/handicap
  if(creds&&fedId){
    onM("Obteniendo handicap actual...");
    try{
      var r3=await fetch(COURSES_API+"/?auth_handicap="+fedId,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:creds.u,password:creds.p})});
      if(r3.ok){hiOnly=await r3.json()}
    }catch(e3){errLog.push("HI auth: "+e3.message)}
  }

  // Intento 4: scores (evolution history) for own/linked players
  var scores=null;
  if(creds&&fedId){
    try{
      var r4=await fetch(COURSES_API+"/?auth_scores="+fedId,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:creds.u,password:creds.p})});
      if(r4.ok){scores=await r4.json();if(scores.error)scores=null}
    }catch(e4){}
  }

  if(hiOnly){
    // Build a minimal data object with HI but no rounds
    var prof=loadProfiles().find(function(p){return p.license===lic});
    return{
      name:prof?prof.name:"Jugador",
      hi:hiOnly.value,
      rounds:[],
      scores:scores,
      source:"api",
      hiStatus:hiOnly.status,
      hiCategory:hiOnly.category,
      hiDate:hiOnly.updatedAt,
      limitedData:true,
      errLog:errLog
    };
  }

  throw new Error("No se pudo obtener datos.\n"+errLog.join(" | ")+"\n\nPara obtener datos completos, inicia sesion con tus credenciales de rfegolf.es (boton en la pantalla principal).");
}

function parseDate(str) {
  const [d, m, y] = str.split("/");
  return new Date(+y, +m - 1, +d);
}

function extractRFEGData(fullText, pages) {
  const result = { player_name: "", handicap_index: null, rounds: [], raw: fullText };
  const nm = fullText.match(/FEDERADO:\s*([A-ZÁÉÍÓÚÑ\s,]+)\s*\(/i);
  if (nm) result.player_name = nm[1].trim().replace(/,$/, "");
  const hm = fullText.match(/NUEVO\s+H[AÁ]NDICAP[:\s]+(\d+[.,]\d)/i);
  if (hm) result.handicap_index = parseFloat(hm[1].replace(",", "."));

  const diffs = extractDifferentials(pages[4] || "");
  const p3 = extractPage3Data(pages[2] || "");
  const p1 = extractPage1Data(pages[0] || "");
  const n = Math.max(p1.length, p3.length, diffs.length);
  const roundsRaw = [];

  for (let i = 0; i < n; i++) {
    const r1 = p1[i] || {}, r3 = p3[i] || {};
    const diff = diffs[i] !== undefined ? diffs[i] : (r3.nivel || 0);
    roundsRaw.push({
      date: r1.date || r3.date || "",
      tournament: r1.tournament || r3.tournament || "",
      course: r1.course || "",
      cr: r3.cr || r1.cr || 0,
      slope: r3.slope || r1.slope || 0,
      hcp_juego: r1.hcp_juego || 0,
      stb: r1.stb || 0,
      asc: r3.asc || r1.asc || 0,
      differential: diff,
    });
  }

  // Ordenar cronológicamente: antigua → reciente
  roundsRaw.sort((a, b) => {
    if (!a.date || !b.date) return 0;
    return parseDate(a.date) - parseDate(b.date);
  });

  result.rounds = roundsRaw;
  return result;
}

function extractDifferentials(t) {
  const d = [];
  const lines = t.split(/(?=\b\d{1,2}\s+\d{2}\/\d{2}\/\d{4})/);
  for (const l of lines) {
    const m = l.match(/^\s*\d{1,2}\s+\d{2}\/\d{2}\/\d{4}\s+.+?\s+(\d+[.,]\d)\s*$/);
    if (m) { d.push(parseFloat(m[1].replace(",", "."))); continue; }
    const all = l.match(/\d+\.\d/g) || l.match(/\d+,\d/g);
    const dm = l.match(/^\s*\d{1,2}\s+\d{2}\/\d{2}\/\d{4}/);
    if (dm && all && all.length > 0) d.push(parseFloat(all[all.length - 1].replace(",", ".")));
  }
  return d;
}

function extractPage3Data(t) {
  const r = [];
  const p = /(\d{1,2})\s+(\d{2}\/\d{2}\/\d{4})\s+(.+?)\s+(\d+)\s+(\d+[.,]\d+?)\s+(\d+)\s+(-?\d+)\s+(\d+[.,]\d+)/g;
  let m;
  while ((m = p.exec(t)) !== null) {
    r.push({ date: m[2], tournament: m[3].trim(), rba: parseInt(m[4]), cr: parseFloat(m[5].replace(",", ".")), slope: parseInt(m[6]), asc: parseInt(m[7]), nivel: parseFloat(m[8].replace(",", ".")) });
  }
  return r;
}

function extractPage1Data(t) {
  const r = [];
  const p = /(\d{1,2})\s+(\d{2}\/\d{2}\/\d{4})\s+([\s\S]*?)\s+([1-9])\s+([\s\S]*?)\s+Individuales\s+(\d+)\s+(\d+[.,]\d+)\/(\d+)\/(\d+)\s+[\d.,]+\s+(\d+)\s+(\d+)\s+(-?\d+)/g;
  let m;
  while ((m = p.exec(t)) !== null) {
    var courseName = m[5].trim().replace(/\s+/g, " ").replace(/^\d+\s+/, "");
    r.push({ date: m[2], tournament: m[3].trim().replace(/\s+/g, " "), course: courseName, cr: parseFloat(m[7].replace(",", ".")), slope: parseInt(m[8]), hcp_juego: parseInt(m[10]), stb: parseInt(m[11]), asc: parseInt(m[12]) });
  }
  if (r.length === 0) {
    const sp = /(\d{2}\/\d{2}\/\d{4})[\s\S]*?(\d+[.,]\d+)\/(\d+)\/\d+\s+[\d.,]+\s+(\d+)\s+(\d+)\s+(-?\d+)/g;
    let sm;
    while ((sm = sp.exec(t)) !== null) {
      r.push({ date: sm[1], tournament: "", course: "", cr: parseFloat(sm[2].replace(",", ".")), slope: parseInt(sm[3]), hcp_juego: parseInt(sm[4]), stb: parseInt(sm[5]), asc: parseInt(sm[6]) });
    }
  }
  return r;
}



// Styles — sistema de temas "Contorno" (Torneo = verde Augusta dominante, Papel = modo alto contraste exterior)
// C es un objeto MUTABLE y compartido: applyTheme() reescribe sus valores en el sitio (misma referencia),
// y como ningun componente usa React.memo, un cambio de estado en App fuerza a toda la app a releer
// los C.xxx actuales en cada render. lbl()/inp() son funciones (no objetos estaticos) por el mismo motivo:
// deben leer los colores vigentes en el momento de renderizar, no los que habia al cargar el modulo.
var THEMES={
  dark:{bg:"#046A38",green:"#063422",gl:"#0a4a30",gold:"#9fb3a5",gd:"rgba(159,179,165,0.85)",white:"#F4F1E9",dim:"#9fb3a5",dimStrong:"#c3d2c8",dimmer:"rgba(232,223,195,0.2)",card:"rgba(244,241,233,0.02)",border:"rgba(232,223,195,0.35)",good:"#CFE8D8",bad:"#E2A98F",blue:"#6FA8C9",accent:"#F5D400",flagRed:"#B23A2E",heroTrend:"#F5D400",inputBg:"rgba(244,241,233,0.05)",contour:"#E8DFC3"},
  paper:{bg:"#F3EEDD",green:"#e8e0c6",gl:"#ece4cc",gold:"#7d8a7c",gd:"rgba(125,138,124,0.9)",white:"#1B2A21",dim:"#7d8a7c",dimStrong:"#3f4c42",dimmer:"rgba(27,42,33,0.15)",card:"rgba(27,42,33,0.02)",border:"#ddd4b8",good:"#046A38",bad:"#B65B45",blue:"#3E7B95",accent:"#F5D400",flagRed:"#B23A2E",heroTrend:"#046A38",inputBg:"rgba(27,42,33,0.04)",contour:"#046A38"}
};
var C=Object.assign({},THEMES.dark);
function applyTheme(paper){Object.assign(C,paper?THEMES.paper:THEMES.dark)}
function loadPaperMode(){try{return localStorage.getItem("theme_paper")==="1"}catch(e){return false}}
function savePaperMode(v){try{localStorage.setItem("theme_paper",v?"1":"0")}catch(e){}}
applyTheme(loadPaperMode());

function lbl(t){var c=t||C;return {display:"block",fontSize:"11px",letterSpacing:"2px",color:c.dim,marginBottom:"6px",fontFamily:"'JetBrains Mono',monospace"}}
function inp(t){var c=t||C;return {width:"100%",background:c.inputBg,border:"1px solid "+c.border,borderRadius:"8px",color:c.white,padding:"12px 14px",fontSize:"15px",outline:"none",boxSizing:"border-box",fontFamily:"'Space Grotesk',sans-serif"}}
// El modal de login es una superficie temporal y enfocada: se queda siempre en la
// version oscura de la marca (no sigue el toggle Torneo/Papel) para no tener que
// re-tematizar cada rgba(...) suelto de dentro, y porque no se mira largo rato al sol.

function CourseStats(p){
  var st=useState(null),exp=st[0],setExp=st[1];
  // Build a CR/Slope to real course name map from rounds that have course
  var crSlMap={};p.rounds.forEach(function(r){if(r.course){var key=r.cr+"/"+r.slope;if(!crSlMap[key])crSlMap[key]=r.course}});
  // Tournament-like patterns
  var tourneyRe=/jornada|torneo|prueba|copa|ranking|circuito|campeonato/i;
  var stats={};p.rounds.forEach(function(r){
    var nm=r.course||r.tournament||"?";
    // If name looks like a tournament, try to find real course by CR/Slope
    if(!r.course&&tourneyRe.test(nm)){var key=r.cr+"/"+r.slope;if(crSlMap[key])nm=crSlMap[key]}
    if(!stats[nm])stats[nm]={diffs:[],dates:[],stbs:[],cr:r.cr,slope:r.slope};stats[nm].diffs.push(r.differential);stats[nm].dates.push(r.date);stats[nm].stbs.push(r.stb)});
  var sorted=Object.keys(stats).map(function(nm){var s=stats[nm];var avg=Math.round(s.diffs.reduce(function(a,b){return a+b},0)/s.diffs.length*10)/10;return{name:nm,n:s.diffs.length,avg:avg,best:Math.min.apply(null,s.diffs),worst:Math.max.apply(null,s.diffs),last:s.dates[s.dates.length-1],bstb:Math.max.apply(null,s.stbs.concat([0])),cr:s.cr,slope:s.slope,diffs:s.diffs}}).sort(function(a,b){return b.n-a.n||a.avg-b.avg});
  var maxN=sorted.length?sorted[0].n:1;
  return(<Card style={{marginBottom:"20px"}}><div style={{display:"flex",alignItems:"center",gap:"10px",marginBottom:"14px"}}><TabIcon name="campos" color={C.white} size={18}/><h2 style={{margin:0,fontSize:"16px",color:C.white,fontWeight:"600"}}>Estadisticas por Campo</h2></div>
    {sorted.map(function(s,i){var isO=exp===i;var bw=Math.round(s.n/maxN*100);var dc=s.avg<=18?C.good:s.avg<=23?C.gold:C.bad;
      return(<div key={i} style={{marginBottom:"6px"}}>
        <div onClick={function(){setExp(isO?null:i)}} style={{background:isO?"rgba(232,223,195,0.08)":"rgba(255,255,255,0.02)",border:"1px solid "+(isO?"rgba(232,223,195,0.2)":C.border),borderRadius:isO?"10px 10px 0 0":"10px",padding:p.mob?"10px 12px":"12px 16px",cursor:"pointer"}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"6px"}}>
            <div style={{flex:1,minWidth:0}}><div style={{color:C.white,fontSize:p.mob?"12px":"13px",fontWeight:"500",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{s.name}</div></div>
            <div style={{display:"flex",alignItems:"center",gap:"12px",flexShrink:0}}><span title="Veces jugado en este campo" style={{fontSize:"10px",color:C.dim,fontFamily:"'JetBrains Mono',monospace"}}>{s.n}x</span><span title={"Media de diferencial en este campo: "+s.avg.toFixed(1)+". Cuanto mas bajo, mejor"} style={{fontSize:"15px",fontFamily:"'JetBrains Mono',monospace",fontWeight:"600",color:dc}}>{s.avg.toFixed(1)}</span><span style={{fontSize:"10px",color:C.dimmer}}>{isO?"\u25B2":"\u25BC"}</span></div>
          </div>
          <div style={{background:C.dimmer,borderRadius:"3px",height:"4px"}}><div style={{width:bw+"%",height:"100%",background:C.gold,borderRadius:"3px"}}/></div>
        </div>
        {isO?<div style={{background:"rgba(0,0,0,0.2)",border:"1px solid rgba(232,223,195,0.15)",borderTop:"none",borderRadius:"0 0 10px 10px",padding:"12px 16px"}}>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:"10px",marginBottom:"10px"}}>
            <div title="Tu mejor diferencial en este campo. Cuanto mas bajo, mejor juegas" style={{textAlign:"center"}}><div style={{fontSize:"18px",fontFamily:"'JetBrains Mono',monospace",color:C.good}}>{s.best.toFixed(1)}</div><div style={{fontSize:"8px",letterSpacing:"1px",color:C.dim}}>MEJOR DIF.</div></div>
            <div title="Tu peor diferencial en este campo" style={{textAlign:"center"}}><div style={{fontSize:"18px",fontFamily:"'JetBrains Mono',monospace",color:C.bad}}>{s.worst.toFixed(1)}</div><div style={{fontSize:"8px",letterSpacing:"1px",color:C.dim}}>PEOR DIF.</div></div>
            <div title="Tu mejor puntuacion Stableford en este campo. Cuanto mas alto, mejor" style={{textAlign:"center"}}><div style={{fontSize:"18px",fontFamily:"'JetBrains Mono',monospace",color:C.gold}}>{s.bstb||"\u2014"}</div><div style={{fontSize:"8px",letterSpacing:"1px",color:C.dim}}>MEJOR STB</div></div>
          </div>
          <div style={{fontSize:"10px",color:C.dim,fontFamily:"'JetBrains Mono',monospace",display:"flex",gap:"12px",flexWrap:"wrap"}}><span>CR {s.cr}</span><span>Slope {s.slope}</span><span>Ultima: {s.last}</span></div>
          {s.diffs.length>1?<div title="Cada barra es una ronda. Mas baja y verde = mejor resultado" style={{marginTop:"8px",display:"flex",gap:"4px",alignItems:"flex-end",height:"32px"}}>{s.diffs.map(function(d,j){var mx=Math.max.apply(null,s.diffs),mn=Math.min.apply(null,s.diffs),rg=mx-mn||1;var h=8+(d-mn)/rg*24;return<div key={j} title={"Dif. "+d.toFixed(1)} style={{flex:1,height:h+"px",background:d<=18?C.good:d<=23?C.gold:C.bad,borderRadius:"2px",opacity:0.7}}/>})}</div>:null}
        </div>:null}
      </div>)
    })}
  </Card>)
}

function HIChart(p){
  if(!p.history||p.history.length<2)return(<div style={{padding:"20px",textAlign:"center",color:C.dim,fontSize:"12px"}}>Se necesitan al menos 2 consultas con HI diferente para la grafica.</div>);
  var all=p.history.concat(p.h2||[]);var vs=all.map(function(x){return x.hi});var lo=Math.floor(Math.min.apply(null,vs)-1),hi=Math.ceil(Math.max.apply(null,vs)+1),rng=hi-lo||1;
  var W=340,H=180,PD={t:20,r:15,b:30,l:40},pW=W-PD.l-PD.r,pH=H-PD.t-PD.b;
  function pts(h){if(!h||h.length<2)return"";return h.map(function(pt,i){return(PD.l+i/(h.length-1)*pW)+","+(PD.t+(1-(pt.hi-lo)/rng)*pH)}).join(" ")}
  var yT=[];var stp=rng<=5?0.5:rng<=10?1:2;for(var v=Math.ceil(lo/stp)*stp;v<=hi;v+=stp)yT.push({v:v,y:PD.t+(1-(v-lo)/rng)*pH});
  return(<svg viewBox={"0 0 "+W+" "+H} style={{width:"100%",maxWidth:"500px"}}>
    {yT.map(function(t,i){return<g key={i}><line x1={PD.l} y1={t.y} x2={W-PD.r} y2={t.y} stroke={C.dimmer} strokeWidth="0.5"/><text x={PD.l-6} y={t.y+3} textAnchor="end" fill={C.dim} fontSize="8" fontFamily="'JetBrains Mono',monospace">{t.v.toFixed(1)}</text></g>})}
    {p.history.map(function(pt,i){if(p.history.length>8&&i>0&&i<p.history.length-1&&i%Math.ceil(p.history.length/6)!==0)return null;var x=PD.l+i/(p.history.length-1)*pW;return<text key={i} x={x} y={H-5} textAnchor="middle" fill={C.dim} fontSize="7" fontFamily="'JetBrains Mono',monospace">{pt.date.slice(5)}</text>})}
    <polyline points={pts(p.history)} fill="none" stroke={C.contour} strokeWidth="2" strokeLinejoin="round"/>
    {p.history.map(function(pt,i){var x=PD.l+i/(p.history.length-1)*pW,y=PD.t+(1-(pt.hi-lo)/rng)*pH;return<circle key={i} cx={x} cy={y} r="3" fill={C.contour}/>})}
    {p.h2&&p.h2.length>=2?<><polyline points={pts(p.h2)} fill="none" stroke={C.blue} strokeWidth="2" strokeDasharray="4,3"/>{p.h2.map(function(pt,i){var x=PD.l+i/(p.h2.length-1)*pW,y=PD.t+(1-(pt.hi-lo)/rng)*pH;return<circle key={i} cx={x} cy={y} r="3" fill={C.blue}/>})}</>:null}
    {p.n1?<text x={W-PD.r} y={PD.t-6} textAnchor="end" fill={C.white} fontSize="8" fontFamily="'JetBrains Mono',monospace">{p.n1}</text>:null}
    {p.n2&&p.h2&&p.h2.length>=2?<text x={W-PD.r} y={PD.t+6} textAnchor="end" fill={C.blue} fontSize="8" fontFamily="'JetBrains Mono',monospace">{p.n2}</text>:null}
  </svg>)
}

function RoundRow(p){
  var r=p.round,u=p.isUsed,n=p.rowLabel,m=p.mob;var d=r.differential;var c=d<=15?C.good:d<=22?C.gold:C.bad;
  if(m)return(<div style={{padding:"10px 12px",background:u?"rgba(232,223,195,0.07)":"rgba(255,255,255,0.02)",borderRadius:"10px",marginBottom:"4px",borderLeft:u?"3px solid "+C.gold:"3px solid transparent"}}><div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"4px"}}><div style={{display:"flex",alignItems:"center",gap:"6px",flex:1,minWidth:0}}><span style={{color:C.dimmer,fontSize:"10px",fontFamily:"'JetBrains Mono',monospace"}}>#{n}</span><span style={{color:C.white,fontSize:"12px",fontWeight:"500",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{r.course||r.tournament||"\u2014"}</span></div><div style={{display:"flex",alignItems:"center",gap:"6px",flexShrink:0}}><span style={{color:c,fontWeight:"600",fontSize:"14px",fontFamily:"'JetBrains Mono',monospace"}}>{d.toFixed(1)}</span><span style={{fontSize:"12px"}}>{u?"\u2B50":""}</span></div></div><div style={{display:"flex",gap:"12px",fontSize:"10px",fontFamily:"'JetBrains Mono',monospace",color:C.dim}}><span>{r.date}</span><span>CR {r.cr}</span><span>SLP {r.slope}</span><span>STB {r.stb}</span></div></div>);

}

function HIGoal(p){
  var stored=null;try{stored=JSON.parse(localStorage.getItem("goal_"+p.lic))}catch(e){}
  var _g=useState(stored?stored.target:""),goal=_g[0],setGoal=_g[1];
  var _s=useState(stored?stored.start:null),start=_s[0],setStart=_s[1];
  var _e=useState(!!stored),editing=_e[0],setEditing=_e[1];
  var save=function(){var g=parseFloat(goal);if(isNaN(g)||g<0||g>54)return;var obj={target:g,start:stored&&stored.start?stored.start:p.hi,date:stored&&stored.date?stored.date:new Date().toISOString().slice(0,10)};localStorage.setItem("goal_"+p.lic,JSON.stringify(obj));setStart(obj.start);setEditing(true)};
  var clear=function(){localStorage.removeItem("goal_"+p.lic);setGoal("");setStart(null);setEditing(false)};

  if(!editing||!stored){return(<Card style={{marginBottom:"20px"}}>
    <div style={{display:"flex",alignItems:"center",gap:"10px",marginBottom:"14px"}}><TabIcon name="goal" color={C.white} size={18}/><h2 style={{margin:0,fontSize:"16px",color:C.white,fontWeight:"600"}}>Objetivo de Handicap</h2></div>
    <div style={{fontSize:"12px",color:C.dim,marginBottom:"12px"}}>Define tu meta y sigue tu progreso</div>
    <div style={{display:"flex",gap:"10px",alignItems:"flex-end"}}>
      <div style={{flex:1}}><label style={lbl()}>MI OBJETIVO (HI)</label><input value={goal} onChange={function(e){setGoal(e.target.value)}} placeholder={p.hi!=null?String(Math.floor(p.hi-3)):""} style={inp()} type="number" step="0.1"/></div>
      <button onClick={save} style={{background:C.green,border:"none",borderRadius:"10px",color:C.white,padding:"14px 20px",cursor:"pointer",fontSize:"12px",fontFamily:"'JetBrains Mono',monospace"}}>FIJAR</button>
    </div>
  </Card>)}

  var tgt=stored.target,st=stored.start,dt=stored.date;
  var hi=p.hi!=null?p.hi:st;
  var totalDist=st-tgt;var progress=totalDist>0?Math.min(Math.max((st-hi)/totalDist,0),1):0;
  var pct=Math.round(progress*100);
  var remaining=Math.round((hi-tgt)*10)/10;
  var done=remaining<=0;
  var h5=p.h5;
  var trend=h5!=null&&hi!=null?(h5<hi?"good":h5>hi?"bad":"same"):"same";

  // Proyeccion: regresion lineal HI vs tiempo sobre el historial de consultas
  var proj=null;
  (function(){
    var h=loadHistory(p.lic).filter(function(x){return x.hi!=null});if(!h||h.length<3||hi==null)return;
    var pts=h.map(function(x){return{t:new Date(x.date).getTime()/86400000,y:x.hi}});
    var n=pts.length,sx=0,sy=0,sxy=0,sxx=0;
    pts.forEach(function(q){sx+=q.t;sy+=q.y;sxy+=q.t*q.y;sxx+=q.t*q.t});
    var den=n*sxx-sx*sx;if(!den)return;
    var slope=(n*sxy-sx*sy)/den; // puntos de HI por dia
    if(slope>=-0.0005){proj={flat:true};return}
    var days=(hi-tgt)/(-slope);
    if(days>365*5){proj={flat:true};return}
    var d=new Date(Date.now()+days*86400000);
    proj={date:d.toLocaleDateString("es-ES",{month:"long",year:"numeric"}),days:Math.round(days)};
  })();

  return(<Card style={{marginBottom:"20px"}}>

          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"6px"}}>
            {groups[recName].map(function(t,i){

                <div style={{display:"flex",alignItems:"center",justifyContent:"center",gap:"6px",marginBottom:"4px"}}>

    <input value={q} onChange={function(e){doSearch(e.target.value)}} placeholder="Escribe nombre del campo..." style={Object.assign({},inp(),{marginBottom:"6px"})} type="text" autoComplete="off"/>
    {favs.length>0?<div style={{marginBottom:"6px"}}><div style={{fontSize:"10px",letterSpacing:"1.5px",color:C.gd,margin:"4px 0 6px",fontFamily:"'JetBrains Mono',monospace"}}>RECIENTES</div><div style={{display:"flex",gap:"6px",flexWrap:"wrap"}}>{favs.map(function(f,i){

    {loading?<div style={{fontSize:"11px",color:C.dim,padding:"8px",textAlign:"center"}}>Buscando...</div>:null}
    {err?<div style={{fontSize:"11px",color:C.bad,padding:"4px"}}>{err}</div>:null}
    {res.length>0?<div style={{maxHeight:"180px",overflowY:"auto"}}>{res.map(function(c,i){

        <div style={{fontSize:"13px",color:C.white,fontWeight:"500"}}>{c.name}</div>
        <div style={{fontSize:"10px",color:C.dim,marginTop:"2px"}}>{c.city}{c.community?" \u2022 "+c.community:""}{c.holes?" \u2022 "+c.holes+"h":""}</div>
      </div>
    })}</div>:null}
    {q.length>=2&&!loading&&res.length===0&&!err&&!tees?<div style={{fontSize:"11px",color:C.dim,padding:"8px",textAlign:"center"}}>Sin resultados. Puedes introducir los datos manualmente abajo.</div>:null}
  </div>)
}

function Simulator(p){
  var _cr=useState(""),cr=_cr[0],sCr=_cr[1],_sl=useState(""),sl=_sl[0],sSl=_sl[1],_asc=useState("0"),asc=_asc[0],sAsc=_asc[1],_mn=useState("70"),mn=_mn[0],sMn=_mn[1],_mx=useState("105"),mx=_mx[0],sMx=_mx[1],_r=useState([]),res=_r[0],sRes=_r[1];
  var _sel=useState(""),sel=_sel[0],sSel=_sel[1];
  var _nine=useState(false),nine=_nine[0],sNine=_nine[1];
  var onNineToggle=function(){var n=!nine;sNine(n);if(n){sMn("35");sMx("60")}else{sMn("70");sMx("105")}sRes([])};
  var onCourseSelect=function(d){if(d){sCr(String(d.vc));sSl(String(d.slope));sSel(d.name)}else{sCr("");sSl("");sSel("")}};
  var run=function(){
    if(!cr||!sl)return;
    var ascVal=parseInt(asc)||0;
    var crVal=parseFloat(cr),slVal=parseInt(sl);
    var mnVal=parseInt(mn)||(nine?35:70);
    var mxVal=parseInt(mx)||(nine?60:105);
    var o=[];
    for(var g=mnVal;g<=mxVal;g++){
      var r;
      if(nine){
        var diff9=Math.round(((g-crVal-ascVal)*113/slVal)*10)/10;
        var diffExp=p.hi!=null?Math.round((p.hi/2)*10)/10:0;
        var diffComb=Math.round((diff9+diffExp)*10)/10;
        r=simRound(p.rounds,g,crVal,slVal,ascVal,diffComb);
        r.d9=diff9;r.dExp=diffExp;r.df=diffComb;
      }else{
        r=simRound(p.rounds,g,crVal,slVal,ascVal);
      }
      var d=r.nh!=null&&p.hi!=null?Math.round((r.nh-p.hi)*10)/10:null;
      o.push({g:g,hi:r.nh,d:r.df,d9:r.d9,dExp:r.dExp,delta:d,c:r.cp});
    }
    sRes(o);
  };
  var thr=res.find(function(s){return s.delta!=null&&s.delta<0});
  var ci=res.findIndex(function(s,i){return!s.c&&i>0&&res.slice(i).every(function(r){return r.hi===s.hi})});
  var ceil=ci>=0?res[ci]:null;var disp=ceil?res.slice(0,ci):res;

      <div style={{width:"18px",height:"18px",borderRadius:"4px",border:"1px solid "+(nine?C.good:C.border),background:nine?"rgba(93,184,112,0.25)":"transparent",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
        {nine?<span style={{fontSize:"11px",color:C.good}}>{"\u2714"}</span>:null}
      </div>
      <span style={{fontSize:"12px",color:nine?C.good:C.dim}}>Ronda de 9 hoyos</span>
    </div>
    {nine&&p.hi==null?<div style={{background:"rgba(232,223,195,0.08)",border:"1px solid rgba(232,223,195,0.2)",borderRadius:"8px",padding:"8px 12px",marginBottom:"12px",fontSize:"11px",color:C.gold}}>Sin HI registrado: el diferencial esperado se calcula como 0</div>:null}
    <CourseSearch onSelect={onCourseSelect}/>
    {sel?<div style={{background:"rgba(93,184,112,0.1)",border:"1px solid rgba(93,184,112,0.2)",borderRadius:"8px",padding:"8px 12px",marginBottom:"12px",fontSize:"11px",color:C.good}}>{"\u2714"} {sel}</div>:null}
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:"10px",marginBottom:"10px"}}><div><label style={lbl()}>{nine?"CR 9H":"V. Campo"}</label><input value={cr} onChange={function(e){sCr(e.target.value)}} placeholder={nine?"35.5":"71.4"} style={inp()} type="number" step="0.1"/></div><div><label style={lbl()}>{nine?"Slope 9H":"Slope"}</label><input value={sl} onChange={function(e){sSl(e.target.value)}} placeholder="125" style={inp()} type="number"/></div><div><label style={lbl()}>ASC</label><input value={asc} onChange={function(e){sAsc(e.target.value)}} placeholder="0" style={inp()} type="number"/></div></div>
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"10px",marginBottom:"12px"}}><div><label style={lbl()}>Golpes min</label><input value={mn} onChange={function(e){sMn(e.target.value)}} style={inp()} type="number"/></div><div><label style={lbl()}>Golpes max</label><input value={mx} onChange={function(e){sMx(e.target.value)}} style={inp()} type="number"/></div></div>

    {res.length>0?<div style={{marginTop:"18px"}}>
      {nine?<div style={{background:"rgba(232,223,195,0.06)",border:"1px solid rgba(232,223,195,0.15)",borderRadius:"8px",padding:"8px 12px",marginBottom:"12px",fontSize:"10px",color:C.dim}}>Difer. combinado = difer. 9H + esperado WHS (HI/2{p.hi!=null?" = "+Math.round(p.hi/2*10)/10:""}). Estimacion aproximada; el calculo oficial RFEG puede variar en decimas.</div>:null}
      {thr&&!nine?<div style={{background:"rgba(93,184,112,0.12)",border:"1px solid rgba(93,184,112,0.25)",borderRadius:"10px",padding:"12px",marginBottom:"12px",fontSize:"13px",color:C.good}}>Para bajar el HI: <strong>{thr.g} golpes o menos</strong></div>:null}
      <div style={{maxHeight:"300px",overflowY:"auto"}}>
        <div style={{display:"grid",gridTemplateColumns:nine?"45px 100px 80px 70px 40px":"55px 80px 80px 70px 40px",gap:"4px",padding:"6px 8px",fontSize:"9px",color:C.dim,borderBottom:"1px solid "+C.border,marginBottom:"6px"}}>

        <div style={{fontSize:"12px",color:C.dim,lineHeight:1.8}}>
          <div><span style={{color:C.gold}}>1.</span> <span style={{color:C.white}}>Iniciar sesion</span> con tus credenciales de rfegolf.es</div>
          <div><span style={{color:C.gold}}>2.</span> <span style={{color:C.white}}>Asociar tu licencia</span> con tu ID de federado (puedes verlo en tu perfil de rfegolf.es)</div>
          <div><span style={{color:C.gold}}>3.</span> Solo podras ver datos completos de <span style={{color:C.white}}>tu cuenta y jugadores vinculados</span></div>
        </div>
        <button onClick={function(){setShowLogin(true)}} style={{marginTop:"14px",background:C.green,border:"none",borderRadius:"10px",color:C.white,padding:"12px",cursor:"pointer",fontSize:"13px",fontFamily:"'JetBrains Mono',monospace",width:"100%"}}>CONFIGURAR SESION RFEG</button>
        {data.scores&&data.scores.length>0?<div style={{marginTop:"14px"}}><div style={{fontSize:"10px",letterSpacing:"1.5px",color:C.gd,marginBottom:"8px"}}>HISTORIAL DE HANDICAP ({data.scores.length} REGISTROS)</div>{data.scores.slice(0,10).map(function(s,i){return<div key={i} style={{display:"flex",justifyContent:"space-between",padding:"6px 10px",background:C.card,borderRadius:"6px",marginBottom:"3px",fontSize:"11px",fontFamily:"'JetBrains Mono',monospace"}}><span style={{color:C.dim}}>{s.date}</span><span style={{color:C.white,flex:1,marginLeft:"12px",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{s.event}</span><span style={{color:C.gold,marginLeft:"8px",fontWeight:"600"}}>{s.handicap}</span></div>})}</div>:null}
        {data.hiDate?<div style={{marginTop:"10px",fontSize:"10px",color:C.dim,fontFamily:"'JetBrains Mono',monospace"}}>HI actualizado: {data.hiDate} | Estado: {data.hiStatus} | Categoria: {data.hiCategory}</div>:null}
      </Card>:null}

      {(function(){var l10=data.rounds.slice(-10),l5=data.rounds.slice(-5);var h10=l10.length?Math.round(l10.reduce(function(s,r){return s+r.differential},0)/l10.length*10)/10:null;var h5=l5.length?Math.round(l5.reduce(function(s,r){return s+r.differential},0)/l5.length*10)/10:null;var t10=h10!=null&&hi!=null?(h10<hi?"good":h10>hi?"bad":"same"):"same";var t5=h5!=null&&hi!=null?(h5<hi?"good":h5>hi?"bad":"same"):"same";
        return<div><div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr 1fr",gap:mob?"6px":"12px",marginBottom:"8px"}}>{[{l:"RONDAS",v:data.rounds.length,c:C.white},{l:"COMPUTAN",v:usedSet.size,c:C.accent},{l:"MEJOR",v:last20.length?Math.min.apply(null,last20.map(function(r){return r.differential})).toFixed(1):"—",c:C.white},{l:"MEDIA",v:last20.length?(last20.reduce(function(s,r){return s+r.differential},0)/last20.length).toFixed(1):"—",c:C.white}].map(function(x,i){return<div key={i} style={{background:C.card,border:"1px dashed "+C.border,borderRadius:"10px",padding:mob?"12px 6px":"16px",textAlign:"center"}}><div style={{fontSize:mob?"17px":"22px",fontFamily:"'JetBrains Mono',monospace",fontWeight:"700",color:x.c,marginBottom:"2px"}}>{x.v}</div><div style={{fontSize:mob?"10.5px":"10px",letterSpacing:"0.5px",color:C.dimStrong,fontFamily:"'Space Grotesk',sans-serif",fontWeight:"600",textTransform:"uppercase"}}>{x.l}</div></div>})}</div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:mob?"6px":"12px",marginBottom:"20px"}}><HIndexCard label="H10" val={h10} trend={t10} win={10} mob={mob}/><HIndexCard label="H5" val={h5} trend={t5} win={5} mob={mob}/></div></div>
      })()}

      {(function(){
        var l5=last20.slice(-5);
        if(l5.length<2)return null;
        var vs=l5.map(function(r){return r.differential});var lo=Math.min.apply(null,vs),hiV=Math.max.apply(null,vs),rg=(hiV-lo)||1;
        var W=320,H=40,pad=6;
        var pts=l5.map(function(r,i){return (i/(l5.length-1)*W)+","+(pad+(1-(r.differential-lo)/rg)*(H-2*pad))});
        var lastPt=pts[pts.length-1].split(",");
        return<div style={{marginBottom:"20px"}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",borderTop:"1px solid "+C.dimmer,borderBottom:"1px solid "+C.dimmer,padding:"10px 2px",marginBottom:"8px"}}>
            <span style={{fontSize:"10px",color:C.dim,fontFamily:"'Space Grotesk',sans-serif",fontWeight:"600"}}>Ultimas {l5.length} rondas</span>
          </div>
          <svg width="100%" height={H} viewBox={"0 0 "+W+" "+H}>
            <polyline points={pts.join(" ")} fill="none" stroke={C.contour} strokeWidth="2"/>
            <circle cx={lastPt[0]} cy={lastPt[1]} r="4" fill={C.accent}/>
          </svg>
        </div>
      })()}

      <div className="tabs" style={mob?{position:"fixed",left:0,right:0,bottom:0,zIndex:150,justifyContent:"space-between",margin:0,background:C.green,borderTop:"1px solid "+C.border,padding:"8px 14px calc(8px + env(safe-area-inset-bottom))",overflowX:"visible"}:{justifyContent:"center",marginBottom:"20px"}}>
        {[{id:"evo",name:"evo",label:"Evolucion",needsRounds:false},{id:"campos",name:"campos",label:"Campos",needsRounds:true},{id:"goal",name:"goal",label:"Objetivo",needsRounds:false},{id:"hcpj",name:"hcpj",label:"HCP Juego"},{id:"rondas",name:"rondas",label:"Rondas",needsRounds:true},{id:"sim",name:"sim",label:"Simulador",needsRounds:true}].filter(function(t){return !data.limitedData||!t.needsRounds}).map(function(t){
          var active=tab===t.id;
          var inactiveColor=C.dimStrong;
          return<button key={t.id} onClick={function(){setTab(t.id)}} style={{background:"transparent",border:"none",padding:"6px 4px",cursor:"pointer",display:"flex",flexDirection:"column",alignItems:"center",gap:"4px",minWidth:mob?"auto":"58px",flexShrink:0}}>
            <TabIcon name={t.name} color={active?C.white:inactiveColor} size={19}/>
            <span style={{fontSize:"10.5px",letterSpacing:"0.01em",color:active?C.white:inactiveColor,fontFamily:"'Space Grotesk',sans-serif",fontWeight:active?"600":"500",borderBottom:active?"2px solid "+C.accent:"2px solid transparent",paddingBottom:"3px"}}>{t.label}</span>
          </button>
        })}
      </div>

      {tab==="evo"?<Card style={{marginBottom:"20px"}}><div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"12px",gap:"6px",flexWrap:"wrap"}}><h2 style={{margin:0,fontSize:"16px",color:C.white,fontWeight:"600"}}>Evolucion del Handicap</h2>
        <div style={{display:"flex",gap:"6px"}}>
        {hist.length>=2?<button onClick={function(){setShareErr("");shareChartPNG("hichart",data.name||"Jugador",hi,setShareErr)}} style={{background:"rgba(232,223,195,0.15)",border:"1px solid rgba(232,223,195,0.3)",borderRadius:"8px",color:C.gold,padding:"5px 12px",cursor:"pointer",fontSize:"11px",fontFamily:"'JetBrains Mono',monospace"}}>COMPARTIR</button>:null}
        {profs.length>1&&!compP?<button onClick={function(){var o=profs.filter(function(x){return x.license!==curLic});if(o.length===1){setCompP(o[0]);setHist2(loadHistory(o[0].license))}}} style={{background:"rgba(91,155,213,0.15)",border:"1px solid rgba(91,155,213,0.3)",borderRadius:"8px",color:C.blue,padding:"5px 12px",cursor:"pointer",fontSize:"11px",fontFamily:"'JetBrains Mono',monospace"}}>COMPARAR</button>:null}
        {compP?<button onClick={function(){setCompP(null);setHist2([])}} style={{background:"rgba(91,155,213,0.15)",border:"1px solid rgba(91,155,213,0.3)",borderRadius:"8px",color:C.blue,padding:"5px 12px",cursor:"pointer",fontSize:"11px",fontFamily:"'JetBrains Mono',monospace"}}>QUITAR</button>:null}
        </div>
      </div>
      {shareErr?<div style={{fontSize:"11px",color:C.bad,marginBottom:"10px"}}>{shareErr}</div>:null}
      <div id="hichart"><HIChart history={hist} h2={compP?hist2:null} n1={curProf?(curProf.name||"").split(",")[0].split(" ")[0]:""} n2={compP?(compP.name||"").split(",")[0].split(" ")[0]:""}/></div></Card>:null}

      {tab==="campos"?<CourseStats rounds={data.rounds} mob={mob}/>:null}

      {tab==="goal"?(function(){var l5=data.rounds.slice(-5);var h5v=l5.length?Math.round(l5.reduce(function(s,r){return s+r.differential},0)/l5.length*10)/10:null;return<HIGoal hi={hi} lic={curLic} h5={h5v}/>})():null}

      {tab==="hcpj"?<PlayingHCP hi={hi}/>:null}

      {tab==="rondas"?<Card style={{marginBottom:"20px"}}><div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"4px"}}><h2 style={{margin:0,fontSize:"16px",color:C.white,fontWeight:"600"}}>Ultimas {last20.length} Rondas</h2><span style={{fontSize:"9px",color:C.dim}}>{"\u2B50"} = computa</span></div><div style={{fontSize:"11px",color:C.dim,marginBottom:"12px"}}>Los <span style={{color:C.gold}}>{usedSet.size} mejores</span> de {last20.length}</div>
        {!mob?<div><div style={{display:"grid",gridTemplateColumns:"32px 2fr 1fr 60px 60px 55px 65px 28px",gap:"6px",padding:"5px 14px",fontSize:"9px",letterSpacing:"2px",color:C.dim}}><span>#</span><span>CAMPO</span><span style={{textAlign:"center"}}>FECHA</span><span style={{textAlign:"center"}}>CR</span><span style={{textAlign:"center"}}>SLP</span><span style={{textAlign:"center"}}>STB</span><span style={{textAlign:"center"}}>DIF.</span><span/></div></div>:null}
        {(function(){var rev=last20.slice().reverse();var ds=showAll?rev:rev.slice(0,10);return<div>{ds.map(function(r,i){var idx=last20.length-1-i;return<RoundRow key={i} round={r} isUsed={usedSet.has(idx)} rowLabel={data.rounds.length-i} mob={mob}/>})}{last20.length>10?<button onClick={function(){setSA(!showAll)}} style={{marginTop:"8px",width:"100%",background:"transparent",border:"1px solid "+C.border,color:C.dim,borderRadius:"8px",padding:"10px",cursor:"pointer",fontSize:"12px"}}>{showAll?"MENOS":"VER "+last20.length}</button>:null}</div>})()}
      </Card>:null}

      {tab==="sim"?<Simulator rounds={data.rounds} hi={hi}/>:null}

      <div style={{textAlign:"center",marginTop:"10px"}}><button onClick={function(){consult(curLic)}} style={{background:"transparent",border:"1px solid "+C.border,color:C.dim,borderRadius:"8px",padding:"10px 20px",cursor:"pointer",fontSize:"12px"}}>Actualizar datos</button></div>
    </div>:null}

    </div>
    {showLogin?<LoginModal onClose={function(){setShowLogin(false)}} onLogin={function(){setShowLogin(false);forceUpdate(function(n){return n+1})}} onLogout={function(){forceUpdate(function(n){return n+1})}} onMapId={function(s){var pp=s.split(":");if(pp.length===2){if(!window._rfegFedIds)window._rfegFedIds={};window._rfegFedIds[pp[0]]=pp[1];saveFedIds();forceUpdate(function(n){return n+1})}}} onRefresh={function(){forceUpdate(function(n){return n+1})}}/>:null}
    <div style={{borderTop:"1px solid "+C.border,padding:"14px",textAlign:"center",fontSize:"9px",color:C.dim,marginTop:"20px"}}>HCAPP v16</div>
  </div>)
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);

</script>
